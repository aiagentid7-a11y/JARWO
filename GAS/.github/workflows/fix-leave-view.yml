name: Regression Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Static/unit regression tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Android instrumentation regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --no-daemon --no-configuration-cache --stacktrace
