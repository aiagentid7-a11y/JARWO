name: Build Payroll Employee Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "GAS/**"
      - ".github/workflows/build-gas.yml"

jobs:
  build-payroll-employee:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GAS

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: GAS/**/*.gradle*

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Lint debug
        run: ./gradlew lintDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare upload keystore
        env:
          PAYROLL_KEYSTORE_BASE64: ${{ secrets.PAYROLL_KEYSTORE_BASE64 }}
          PAYROLL_STORE_PASSWORD: ${{ secrets.PAYROLL_STORE_PASSWORD }}
          PAYROLL_KEY_PASSWORD: ${{ secrets.PAYROLL_KEY_PASSWORD }}
          PAYROLL_KEY_ALIAS: ${{ secrets.PAYROLL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${PAYROLL_KEYSTORE_BASE64:-}" || { echo "PAYROLL_KEYSTORE_BASE64 belum tersedia"; exit 1; }
          test -n "${PAYROLL_STORE_PASSWORD:-}" || { echo "PAYROLL_STORE_PASSWORD belum tersedia"; exit 1; }
          test -n "${PAYROLL_KEY_PASSWORD:-}" || { echo "PAYROLL_KEY_PASSWORD belum tersedia"; exit 1; }
          PAYROLL_KEY_ALIAS="${PAYROLL_KEY_ALIAS:-upload}"
          echo "$PAYROLL_KEYSTORE_BASE64" | base64 -d > payroll-upload-key.jks
          test -s payroll-upload-key.jks
          keytool -list -keystore payroll-upload-key.jks -storepass "$PAYROLL_STORE_PASSWORD" -alias "$PAYROLL_KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/GAS/payroll-upload-key.jks" >> "$GITHUB_ENV"
          echo "PAYROLL_STORE_PASSWORD=$PAYROLL_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PAYROLL_KEY_PASSWORD=$PAYROLL_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "PAYROLL_KEY_ALIAS=$PAYROLL_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Verify AAB
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          ls -lh "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: payroll-employee-release-aab
          path: GAS/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
