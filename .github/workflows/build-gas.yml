name: Build GAS Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "GAS/**"
      - ".github/workflows/build-gas.yml"

jobs:
  build-gas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GAS

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: GAS/**/*.gradle*

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Lint debug
        run: ./gradlew lintDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "KEYSTORE_BASE64 belum tersedia"; exit 1; }
          test -n "${STORE_PASSWORD:-}" || { echo "STORE_PASSWORD belum tersedia"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "KEY_PASSWORD belum tersedia"; exit 1; }
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          test -s my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/GAS/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Verify AAB
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          ls -lh "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: gas-release-aab
          path: GAS/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
