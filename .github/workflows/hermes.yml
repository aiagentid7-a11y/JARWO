name: Hermes Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt untuk Hermes Agent"
        required: false
        default: "Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya."
  push:
    branches:
      - main

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout JARWO
        uses: actions/checkout@v4

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Hermes and configure credential pool
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
        run: |
          set -euo pipefail

          hermes --version
          hermes doctor --fix || true

          test -n "$OPENROUTER_API_KEY" || {
            echo "::error::OPENROUTER_API_KEY belum tersedia di GitHub Actions Secrets."
            exit 1
          }

          # Hermes creates/updates ~/.hermes/config.yaml itself.
          # Do NOT hand-edit YAML: use Hermes' supported config command.
          hermes config set credential_pool_strategies.openrouter round_robin
          hermes config check

          echo "=== Hermes credential pool ==="
          hermes auth list openrouter

          echo "=== Credential availability ==="
          echo "OpenRouter key #1: available"
          [ -n "${OPENROUTER_API_KEY_2:-}" ] && echo "OpenRouter key #2: available" || echo "OpenRouter key #2: not configured"
          [ -n "${OPENROUTER_API_KEY_3:-}" ] && echo "OpenRouter key #3: available" || echo "OpenRouter key #3: not configured"

      - name: Run Hermes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          HERMES_PROMPT: ${{ inputs.prompt }}
        run: |
          set -o pipefail
          PROMPT="${HERMES_PROMPT:-Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya.}"
          hermes chat -q "$PROMPT" 2>&1 | tee hermes-output.txt

      - name: Upload Hermes output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-output
          path: hermes-output.txt
          if-no-files-found: warn
