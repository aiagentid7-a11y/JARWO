name: Hermes Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt untuk Hermes Agent"
        required: false
        default: "Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya."

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout JARWO
        uses: actions/checkout@v4

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Hermes
        run: |
          hermes --version
          hermes doctor --fix || true

      - name: Configure Hermes credential pool
        run: |
          CONFIG="$HOME/.hermes/config.yaml"
          if ! grep -q '^credential_pool_strategies:' "$CONFIG"; then
            cat >> "$CONFIG" <<'EOF'

credential_pool_strategies:
  openrouter: round_robin
EOF
          fi
          hermes auth list openrouter || true

      - name: Run Hermes
        env:
          HERMES_PROMPT: ${{ inputs.prompt }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
        run: |
          hermes auth list openrouter || true
          hermes chat --provider openrouter --model openrouter/free -q "$HERMES_PROMPT" | tee hermes-output.txt

      - name: Upload Hermes output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-output
          path: hermes-output.txt
          if-no-files-found: warn
