name: Hermes Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt untuk Hermes Agent"
        required: false
        default: "Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya."
  push:
    branches:
      - main

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout JARWO
        uses: actions/checkout@v4

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Hermes and configure credential pool
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
        run: |
          set -euo pipefail
          hermes --version
          hermes doctor --fix || true
          test -n "$OPENROUTER_API_KEY" || {
            echo "::error::OPENROUTER_API_KEY belum tersedia di GitHub Actions Secrets."
            exit 1
          }
          CONFIG="$HOME/.hermes/config.yaml"
          mkdir -p "$HOME/.hermes"
          touch "$CONFIG"

          python3 - "$CONFIG" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text() if path.exists() else ""
          if "credential_pool_strategies:" not in text:
              text = text.rstrip() + "\n\ncredential_pool_strategies:\n  openrouter: round_robin\n"
          if "model:\n" not in text:
              text = text.rstrip() + "\n\nmodel:\n  provider: openrouter\n"
          elif "provider: openrouter" not in text:
              text = text.rstrip() + "\n\n# CI override\nmodel:\n  provider: openrouter\n"
          path.write_text(text.rstrip() + "\n")
          PY

          echo "=== Hermes config ==="
          grep -A3 -E '^(model:|credential_pool_strategies:)' "$CONFIG" || true
          echo "=== OpenRouter credential pool ==="
          hermes auth list openrouter
          echo "=== Credential availability ==="
          echo "OpenRouter key #1: available"
          [ -n "${OPENROUTER_API_KEY_2:-}" ] && echo "OpenRouter key #2: available" || echo "OpenRouter key #2: not configured"
          [ -n "${OPENROUTER_API_KEY_3:-}" ] && echo "OpenRouter key #3: available" || echo "OpenRouter key #3: not configured"

      - name: Run Hermes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          HERMES_PROMPT: ${{ inputs.prompt }}
        run: |
          set -o pipefail
          PROMPT="${HERMES_PROMPT:-Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya.}"
          hermes chat -q "$PROMPT" 2>&1 | tee hermes-output.txt

      - name: Upload Hermes output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-output
          path: hermes-output.txt
          if-no-files-found: warn
