name: Hermes Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt untuk Hermes Agent"
        required: false
        default: "Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya."
  push:
    branches:
      - main

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout JARWO
        uses: actions/checkout@v4

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Hermes with Atria
        env:
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
        run: |
          set -euo pipefail

          hermes --version
          hermes doctor --fix || true

          test -n "$ATRIA_API_KEY" || {
            echo "::error::ATRIA_API_KEY belum tersedia di GitHub Actions Secrets."
            exit 1
          }

          # Atria exposes an OpenAI-compatible Chat Completions endpoint.
          # Keep the key in the GitHub secret; do not write it into the repo.
          hermes config set model.default Atria-Dawn-Preview
          hermes config set model.provider custom
          hermes config set model.base_url https://api.atria-asi.ai/v1
          hermes config set model.key_env ATRIA_API_KEY
          hermes config check

          echo "=== Hermes model configuration ==="
          hermes config get model || true

      - name: Test Atria API
        env:
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Testing Atria Chat Completions endpoint..."
          RESPONSE="$(curl -fsS https://api.atria-asi.ai/v1/chat/completions             -H "Authorization: Bearer $ATRIA_API_KEY"             -H "Content-Type: application/json"             -d '{
              "model": "Atria-Dawn-Preview",
              "messages": [{"role": "user", "content": "Reply with exactly: ATRIA_OK"}],
              "max_tokens": 16
            }')"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "ATRIA_OK"

      - name: Run Hermes with Atria
        env:
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
          HERMES_PROMPT: ${{ inputs.prompt }}
        run: |
          set -o pipefail
          PROMPT="${HERMES_PROMPT:-Jalankan pemeriksaan singkat terhadap repository ini dan laporkan hasilnya.}"
          hermes chat -q "$PROMPT" 2>&1 | tee hermes-output.txt

      - name: Upload Hermes output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-output
          path: hermes-output.txt
          if-no-files-found: warn
